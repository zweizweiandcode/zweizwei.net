<section class="gallery-section"><div class="room-grid"><article class="room-card" style="transform:rotate(-1.5deg)"><span class="paper-tape" aria-hidden="true"></span><button type="button" class="gallery-trigger" aria-haspopup="dialog" aria-label="Основная спальня"><img class="apartment-photo" src="../../images/valencia/webp/bedroom-with-rugs.webp" alt="Основная спальня" width="1086" height="1448" decoding="async" loading="lazy"><span class="gallery-caption">Основная спальня</span></button><template class="gallery-detail"><h2>Основная спальня</h2>
<p>В спальне находится двуспальная кровать шириной 145 см, прикроватная мебель и телевизор с DVD-плеером. Есть небольшая коллекция фильмов на дисках.</p>
<p>На окнах установлены рольставни, поэтому комнату можно затемнить для сна. Также есть постельное бельё и полотенца.</p>
<p>Обратите внимание: шкаф в этой спальне занят личными вещами. Для хранения одежды можно использовать шкаф в соседней комнате или на большой террасе.</p>
</template></article>
<article class="room-card" style="transform:rotate(1deg)"><span class="paper-tape" aria-hidden="true"></span><button type="button" class="gallery-trigger" aria-haspopup="dialog" aria-label="Малая спальня и рабочее место"><img class="apartment-photo" src="../../images/valencia/webp/Warm%20Minimalist%20Bedroom%20Office%20Corner.webp" alt="Малая спальня и рабочее место" width="1086" height="1448" decoding="async" loading="lazy"><span class="gallery-caption">Малая спальня и рабочее место</span></button><template class="gallery-detail"><h2>Малая спальня и рабочее место</h2>
<p>Эту комнату можно использовать как спальню или кабинет. Здесь стоит раскладная кровать, которая превращается в двуспальную шириной 160 см.</p>
<p>Рядом с окном расположено рабочее место со столом и офисным креслом. Здесь можно спокойно поработать за ноутбуком.</p>
<p>В комнате также есть шкаф для одежды, комод и дополнительное освещение. На окнах установлены рольставни для затемнения.</p>
<p>Кровать можно оставлять сложенной, чтобы в комнате было больше свободного пространства, или разложить для сна.</p>
</template></article>
<article class="room-card" style="transform:rotate(-0.8deg)"><span class="paper-tape" aria-hidden="true"></span><button type="button" class="gallery-trigger" aria-haspopup="dialog" aria-label="Гостиная и обеденная зона"><img class="apartment-photo" src="../../images/valencia/webp/main-room-1.webp" alt="Гостиная и обеденная зона" width="1086" height="1448" decoding="async" loading="lazy"><span class="gallery-caption">Гостиная и обеденная зона</span></button><template class="gallery-detail"><h2>Гостиная и обеденная зона</h2>
<p>В гостиной есть диван, который раскладывается в спальное место шириной 120 см. Рядом расположены телевизор с доступом к интернету, книжные полки и мебель для хранения.</p>
<p>Здесь же находится обеденный стол со стульями, за которым можно поесть, поработать или провести вечер вместе.</p>
<p>В журнальном столике хранятся настольные игры, в том числе Ticket to Ride, Atomic Kittens и другие.</p>
<p>Для сна можно использовать раскладной диван.</p>
</template></article>
<article class="room-card" style="transform:rotate(1.4deg)"><span class="paper-tape" aria-hidden="true"></span><button type="button" class="gallery-trigger" aria-haspopup="dialog" aria-label="Кухня"><img class="apartment-photo" src="../../images/valencia/webp/kitchen-gpt2.webp" alt="Кухня" width="1086" height="1448" decoding="async" loading="lazy"><span class="gallery-caption">Кухня</span></button><template class="gallery-detail"><h2>Кухня</h2>
<p>На кухне есть всё необходимое для приготовления еды: варочная поверхность, духовка, вытяжка, холодильник, микроволновка и посудомоечная машина.</p>
<p>Для кофе есть две кофеварки — капсульная Nespresso и обычная фильтр-кофеварка. Также есть электрический чайник и тостер.</p>
<p>В шкафах хранится посуда для приготовления и сервировки: кастрюли, сковородки, тарелки, чашки, бокалы и столовые приборы.</p>
<p>Из кухни есть выход на небольшой технический балкон, где находятся стиральная машина, раковина, котёл и кладовка с хозяйственными принадлежностями.</p>
</template></article>
<article class="room-card" style="transform:rotate(-1deg)"><span class="paper-tape" aria-hidden="true"></span><button type="button" class="gallery-trigger" aria-haspopup="dialog" aria-label="Ванные комнаты — 1"><img class="apartment-photo" src="../../images/valencia/webp/master-bathroom.webp" alt="Ванные комнаты — 1" width="1086" height="1448" decoding="async" loading="lazy"><span class="gallery-caption">Ванные комнаты — 1</span></button><template class="gallery-detail"><h2>Ванные комнаты</h2>
<p>В квартире две ванные комнаты, обе с душем, раковиной и туалетом.</p>
<p>В основной ванной установлена душевая кабина со стеклянными перегородками и зеркало.</p>
<p>Во второй ванной душевая зона отделена шторкой. Есть зеркало и полочки для принадлежностей.</p>
<p>В квартире также есть фен и полотенца.</p>
</template></article>
<article class="room-card" style="transform:rotate(-1deg)"><span class="paper-tape" aria-hidden="true"></span><button type="button" class="gallery-trigger" aria-haspopup="dialog" aria-label="Ванные комнаты — 2"><img class="apartment-photo" src="../../images/valencia/webp/bathroom-small.webp" alt="Ванные комнаты — 2" width="1086" height="1448" decoding="async" loading="lazy"><span class="gallery-caption">Ванные комнаты — 2</span></button><template class="gallery-detail"><h2>Ванные комнаты</h2>

<p>На балконе есть диван, который раскладывается в спальное место шириной 120 см, небольшой столик, освещение и электрические розетки.</p>
<p>Благодаря остеклению здесь можно проводить время даже в прохладную или ветреную погоду.</p>
</template></article>

<p>На балконе есть диван, который раскладывается в спальное место шириной 120 см, небольшой столик, освещение и электрические розетки.</p>

<article class="room-card" style="transform:rotate(-1.2deg)"><span class="paper-tape" aria-hidden="true"></span><button type="button" class="gallery-trigger" aria-haspopup="dialog" aria-label="Большая терраса"><img class="apartment-photo" src="../../images/valencia/webp/terrace-gpt.webp" alt="Большая терраса" width="1086" height="1448" decoding="async" loading="lazy"><span class="gallery-caption">Большая терраса</span></button><template class="gallery-detail"><h2>Большая терраса</h2>
<p>На большой террасе есть крытая зона отдыха с диваном, который раскладывается в спальное место шириной 120 см. Здесь также находятся обеденный стол со стульями и переносной кондиционер.</p>
<p>В открытой части террасы стоят шезлонги, есть душ, освещение и электрические розетки. Здесь приятно позавтракать, почитать или отдохнуть на свежем воздухе.</p>
<p>На террасе также есть большой шкаф для хранения вещей.</p>
</template></article>
<article class="room-card" style="transform:rotate(-1.5deg)"><span class="paper-tape" aria-hidden="true"></span><button type="button" class="gallery-trigger" aria-haspopup="dialog" aria-label="Технический балкон"><img class="apartment-photo" src="../../images/valencia/webp/gpt-balcony.webp" alt="Технический балкон" width="1254" height="1254" decoding="async" loading="lazy"><span class="gallery-caption">Технический балкон</span></button><template class="gallery-detail"><h2>Технический балкон</h2>
<p>Из кухни есть выход на небольшой технический балкон. Здесь находятся стиральная машина, котёл, техническая раковина и небольшая кладовка.</p>
<p>Также в квартире есть сушилка для белья, утюг, гладильная доска, пылесос и принадлежности для уборки.</p>
</template></article>
<article class="room-card" style="transform:rotate(1deg)"><span class="paper-tape" aria-hidden="true"></span><button type="button" class="gallery-trigger" aria-haspopup="dialog" aria-label="Бассейн и пляж"><img class="apartment-photo" src="../../images/valencia/webp/pool%20-%20color%20corrected.webp" alt="Бассейн" width="1254" height="1254" decoding="async" loading="lazy"><span class="gallery-caption">Бассейн и пляж</span></button><template class="gallery-detail"><h2>Бассейн и пляж</h2>
<p>В жилом комплексе есть бассейн, которым можно пользоваться.</p>
<p>До моря недалеко, на пляж можно ходить пешком. Мне особенно нравится гулять у моря — это помогает расслабиться и отвлечься от повседневных дел.</p>
<p>В квартире есть пляжные полотенца, зонтик, складные стулья и другие пляжные принадлежности, которые можно брать с собой.</p>
